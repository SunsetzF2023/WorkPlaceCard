<!DOCTYPE html>
<html>
<head>
    <title>Version Test</title>
    <style>
        body { background: #222; color: #fff; padding: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Version Test - Should show "startGameWithoutReset called" if latest version</h1>
    <div id="output"></div>
    
    <script type="module">
        import('./src/main.js').then(() => {
            document.getElementById('output').innerHTML = '✅ Latest version loaded successfully';
        }).catch(err => {
            document.getElementById('output').innerHTML = `❌ Error: ${err.message}`;
        });
    </script>
</body>
</html>
