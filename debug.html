<!DOCTYPE html>
<html>
<head>
    <title>Debug Hand Cards</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #222; color: #fff; }
        .debug-info { margin: 10px 0; padding: 10px; background: #333; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Hand Cards Debug</h1>
    <div id="debug-output"></div>
    
    <script type="module">
        import { GameState } from './src/core/gameState.js';
        import { TurnManager } from './src/core/turnManager.js';
        import { loadData } from './src/main.js';
        
        async function debugGame() {
            const output = document.getElementById('debug-output');
            
            try {
                const { cards, decks, heroes } = await loadData();
                const heroMap = Object.fromEntries(heroes.map(h => [h.id, h]));
                
                const playerDeck = decks[0];
                const opponentDeck = decks[1];
                
                GameState.reset();
                
                GameState.player.hero = { ...heroMap[playerDeck.heroId] };
                GameState.opponent.hero = { ...heroMap[opponentDeck.heroId] };
                
                GameState.player.health = GameState.player.hero.health;
                GameState.opponent.health = GameState.opponent.hero.health;
                
                // Build decks
                const cardMap = Object.fromEntries(cards.map(c => [c.id, c]));
                const buildDeck = (deckData) => {
                    return deckData.cards.map(id => ({...cardMap[id]})).filter(Boolean);
                };
                
                GameState.player.deck = buildDeck(playerDeck, cards);
                GameState.opponent.deck = buildDeck(opponentDeck, cards);
                
                output.innerHTML += `
                    <div class="debug-info">
                        <strong>Player Deck:</strong> ${GameState.player.deck.length} cards<br>
                        <strong>Opponent Deck:</strong> ${GameState.opponent.deck.length} cards<br>
                        <strong>Player Hand:</strong> ${GameState.player.hand.length} cards<br>
                        <strong>Opponent Hand:</strong> ${GameState.opponent.hand.length} cards<br>
                        <strong>Player Hero:</strong> ${GameState.player.hero.name} (${GameState.player.health} HP)<br>
                        <strong>Opponent Hero:</strong> ${GameState.opponent.hero.name} (${GameState.opponent.health} HP)
                    </div>
                `;
                
                // Simulate drawing cards
                import('./src/systems/drawSystem.js').then(({ DrawSystem }) => {
                    DrawSystem.drawCards('player', 3);
                    DrawSystem.drawCards('opponent', 3);
                    
                    output.innerHTML += `
                        <div class="debug-info">
                            <strong>After drawing 3 cards each:</strong><br>
                            <strong>Player Hand:</strong> ${GameState.player.hand.length} cards<br>
                            <strong>Opponent Hand:</strong> ${GameState.opponent.hand.length} cards<br>
                            <strong>Player Cards:</strong> ${GameState.player.hand.map(c => c.nameZh).join(', ')}<br>
                            <strong>Opponent Cards:</strong> ${GameState.opponent.hand.map(c => c.nameZh).join(', ')}
                        </div>
                    `;
                });
                
            } catch (error) {
                output.innerHTML += `<div class="debug-info" style="color: red;">Error: ${error.message}</div>`;
            }
        }
        
        debugGame();
    </script>
</body>
</html>
